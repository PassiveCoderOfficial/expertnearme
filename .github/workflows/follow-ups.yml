name: Follow-Up Engine

on:
  schedule:
    - cron: '15 * * * *'  # hourly, offset from the blog cron
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger follow-up run
        run: |
          curl -s -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/follow-ups"
